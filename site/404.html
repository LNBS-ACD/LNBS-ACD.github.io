<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - LNBS-ACD</title>
<link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/222450583?s=200&amp;v=4">
<link rel="stylesheet" href="/styles.css">
<style>
  .img-view { text-align: center; padding: 40px 0; }
  .img-view img { max-width: 90%; max-height: 80vh; border-radius: 8px; border: 1px solid var(--border); }
  .notfound { padding: 60px 0; text-align: center; }
  .notfound h1 { font-size: 4rem; color: var(--accent); margin: 10px 0; }
</style>
<script>
(function () {
  var p = location.pathname;
  var m = p.match(/^\/news\/(\d{8})\/p(\d+)\/?$/);
  if (m) { location.replace('/news/p' + m[2] + '.html'); return; }
  if (p.indexOf('/photo/') === 0) {
    var nf = document.getElementById('nf');
    var iv = document.getElementById('img-view');
    if (nf) nf.style.display = 'none';
    if (iv) { iv.style.display = ''; }
    var img = document.createElement('img');
    img.src = p;
    if (iv) iv.appendChild(img);
    document.title = 'LNBS-ACD 图片';
    return;
  }
  var nm = p.match(/^\/news\/p(\d+)\.html/);
  if (nm) { location.replace('/news/p' + nm[1] + '.html'); return; }
})();
</script>
</head>
<body>
<div class="site-banner">
  <a class="site-banner-inner" href="/index.html">
    <img class="site-banner-logo" src="https://avatars.githubusercontent.com/u/222450583?s=200&amp;v=4" alt="LNBS-ACD logo">
    <div class="site-banner-text">
      <span class="site-banner-name">LNBS-ACD</span>
      <span class="site-banner-tagline">Algorithm &amp; Code Development</span>
    </div>
  </a>
</div>
<header class="site-header">
  <div class="container site-header-inner">
    <nav class="site-nav">
      <a class="site-nav-link" href="/" data-nav="/">首页</a>
      <a class="site-nav-link" href="/news.html" data-nav="/news.html">新闻</a>
      <a class="site-nav-link" href="/about.html" data-nav="/about.html">关于</a>
      <a class="site-nav-link" href="/photo.html" data-nav="/photo.html">图片</a>
    </nav>
  </div>
</header>
<main>
<section class="img-view" id="img-view" style="display:none;">
  <div class="container"><p class="text-dim">图片</p></div>
</section>
<section class="notfound" id="nf">
  <div class="container">
    <h1>404</h1>
    <p class="text-dim">页面不存在或已移动。</p>
    <p><a class="btn-link" href="/index.html">返回首页</a></p>
  </div>
</section>
</main>
<footer class="site-footer">
  <div class="container">
    <p>&copy; 2026 LNBS-ACD. Powered by Curiosity and Chocolate.</p>
  </div>
</footer>
</body>
</html>
